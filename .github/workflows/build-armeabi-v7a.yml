name: Build armeabi-v7a APK

# Builds the 32-bit ARM release APK and publishes it as flow-armeabi-v7a.apk
# (Github flavor) or flow-foss-armeabi-v7a.apk (Foss flavor), the same names
# the main release workflow uses.
# Signed when the RELEASE_KEYSTORE_BASE64 secret exists, otherwise unsigned.
#
# Publishing to GitHub Releases happens only for a signed build, either when a
# tag named release-* is pushed (the tag name becomes the release name) or when
# the workflow is started manually with "publish" ticked and a tag filled in.
on:
  push:
    branches: [ main ]
    tags: [ 'release-*' ]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build'
        type: choice
        default: Foss
        options:
          - Foss
          - Github
      publish:
        description: 'Publish to GitHub Releases (needs signing secrets)'
        type: boolean
        default: false
      tag:
        description: 'Release tag to publish to, e.g. release-1.0 (created if missing)'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLAVOR: ${{ inputs.flavor || 'Foss' }}

jobs:
  build:
    name: Build armeabi-v7a
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set. Building an UNSIGNED release APK."
          fi

      # The ABI splits are configured in app/build.gradle.kts, so Gradle builds
      # every ABI; only the armeabi-v7a file is picked out and published below.
      - name: Build release APK
        run: ./gradlew ":app:assemble${FLAVOR}Release" --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Rename APK
        id: rename
        run: |
          set -euo pipefail
          flavor_lc="$(echo "$FLAVOR" | tr '[:upper:]' '[:lower:]')"
          src="$(ls app/build/outputs/apk/${flavor_lc}/release/app-${flavor_lc}-armeabi-v7a-release*.apk | head -n 1)"
          if [ "$flavor_lc" = "foss" ]; then name="flow-foss-armeabi-v7a.apk"; else name="flow-armeabi-v7a.apk"; fi
          mkdir -p dist
          cp "$src" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.rename.outputs.name }}-${{ steps.keystore.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: dist/${{ steps.rename.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/release-') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
          APK_NAME: ${{ steps.rename.outputs.name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" != "true" ]; then
            echo "::error::Refusing to publish an unsigned APK. Set RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          fi
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$INPUT_TAG"
          fi
          if [ -z "$tag" ]; then
            echo "::error::Fill in the 'tag' input to publish a release."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/$APK_NAME" --clobber
          else
            gh release create "$tag" "dist/$APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes
          fi
          echo "Published $APK_NAME to release $tag."
